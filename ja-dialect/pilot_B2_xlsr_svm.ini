[EXP]
root = ./
name = pilot_B2_xlsr_svm_cleaned_sub
runs = 1
epochs = 20
save = False

[DATA]
databases = ['train', 'test']
train = ./ja-dialect/japanese_dialect_cleaned_train_sub500_clips.csv
train.type = csv
train.absolute_path = False
train.split_strategy = train
test = ./ja-dialect/japanese_dialect_cleaned_test_sub150_clips.csv
test.type = csv
test.absolute_path = False
test.split_strategy = test
target = dialect
labels = ["Hokkaido dialect", "Tohoku dialect", "Kanto dialect", "Hokuriku dialect", "Tokai-Tosan dialect", "Kinki dialect", "Chugoku dialect", "Shikoku dialect", "Hichiku dialect", "Toyonichi dialect", "Satsugu dialect", "Ryukyuan dialect"]

[FEATS]
type = ['wav2vec2-large-xlsr-53']
device = cuda:2

[MODEL]
type = svm
C_val = 10
device = cuda:2
